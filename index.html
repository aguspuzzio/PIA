<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Visor de documentos</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #5f6b76; --line: #dde1e6;
    --accent: #1a7f37; --accent-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --card: #1d2125; --text: #e8eaed; --muted: #9aa4ae; --line: #2e343a; --accent: #3fb950; --accent-ink: #0b1b0f; }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; font: inherit; text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .frame { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 8px; }
  img.view { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  video.view, audio.view { max-width: 100%; max-height: 100%; }
  pre.text { margin: 0; width: 100%; height: 100%; overflow: auto; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .msg { max-width: 460px; text-align: center; color: var(--muted); }
  .msg strong { color: var(--text); display: block; font-size: 17px; margin-bottom: 6px; }
  .hint { font-size: 12.5px; color: var(--muted); padding: 0 16px 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="title">Visor de documentos</h1>
  <div class="tools" id="tools" hidden>
    <a class="btn primary" id="dl" download rel="noopener">Descargar</a>
    <a class="btn" id="open" target="_blank" rel="noopener noreferrer">Abrir original</a>
    <button class="btn" id="alt" type="button" hidden>Ver con otro visor</button>
  </div>
</header>
<main id="stage"></main>
<div class="hint" id="hint" hidden>Si el documento no se muestra, usá «Descargar» o «Ver con otro visor».</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const raw = params.get("u") || "";
  const stage = document.getElementById("stage");
  const titleEl = document.getElementById("title");
  const tools = document.getElementById("tools");
  const hint = document.getElementById("hint");

  function message(title, body) {
    stage.textContent = "";
    const d = document.createElement("div");
    d.className = "msg";
    const s = document.createElement("strong");
    s.textContent = title;
    d.append(s, document.createTextNode(body));
    stage.append(d);
  }

  let url;
  try { url = new URL(raw); } catch {}
  if (!url || url.protocol !== "https:") {
    return message("No hay documento para mostrar", "Este enlace está incompleto. Pedí que te lo envíen de nuevo.");
  }

  const name = (params.get("n") || decodeURIComponent(url.pathname.split("/").pop() || "") || "documento").slice(0, 200);
  const ext = (name.split(".").pop() || "").toLowerCase();
  document.title = name + " · Visor";
  titleEl.textContent = name;
  titleEl.title = name;

  const dl = document.getElementById("dl");
  dl.href = url.href; dl.download = name;
  document.getElementById("open").href = url.href;
  tools.hidden = false;

  const IMG = ["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "avif"];
  const VID = ["mp4", "webm", "mov", "m4v", "ogv"];
  const AUD = ["mp3", "wav", "ogg", "m4a", "flac", "aac"];
  const TXT = ["txt", "md", "csv", "json", "log", "xml", "html", "css", "js", "py", "java", "c", "cpp", "cs", "sql", "yml", "yaml", "ini", "rtf"];
  const OFFICE = ["doc", "docx", "xls", "xlsx", "ppt", "pptx", "odt", "ods", "odp"];

  function frame(src) {
    stage.textContent = "";
    const f = document.createElement("iframe");
    f.className = "frame";
    f.src = src;
    f.setAttribute("referrerpolicy", "no-referrer");
    f.setAttribute("allow", "fullscreen");
    stage.append(f);
    hint.hidden = false;
  }
  const googleViewer = () => "https://docs.google.com/viewer?embedded=true&url=" + encodeURIComponent(url.href);
  const officeViewer = () => "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(url.href);

  const alt = document.getElementById("alt");
  function enableAlt(fn) { alt.hidden = false; alt.onclick = fn; }

  if (IMG.includes(ext)) {
    const i = document.createElement("img");
    i.className = "view"; i.alt = name; i.referrerPolicy = "no-referrer";
    i.onerror = () => message("No se pudo mostrar la imagen", "Descargala con el botón de arriba.");
    i.src = url.href;
    stage.append(i);
  } else if (VID.includes(ext)) {
    const v = document.createElement("video");
    v.className = "view"; v.controls = true; v.src = url.href;
    stage.append(v);
  } else if (AUD.includes(ext)) {
    const a = document.createElement("audio");
    a.className = "view"; a.controls = true; a.src = url.href;
    stage.append(a);
  } else if (ext === "pdf") {
    frame(url.href);
    enableAlt(() => frame(googleViewer()));
  } else if (OFFICE.includes(ext)) {
    frame(officeViewer());
    enableAlt(() => frame(googleViewer()));
  } else if (TXT.includes(ext)) {
    message("Cargando…", "");
    fetch(url.href).then((r) => { if (!r.ok) throw 0; return r.text(); }).then((t) => {
      stage.textContent = "";
      const p = document.createElement("pre");
      p.className = "text";
      p.textContent = t.length > 2000000 ? t.slice(0, 2000000) + "\n\n… (archivo recortado)" : t;
      stage.append(p);
    }).catch(() => {
      frame(url.href);
    });
  } else {
    message("Este tipo de archivo no se puede mostrar acá", "Usá el botón «Descargar» para abrirlo en tu computadora.");
  }
})();
</script>
</body>
</html>
